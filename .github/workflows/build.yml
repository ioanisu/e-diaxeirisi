name: Build Windows EXE
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyinstaller flask pandas openpyxl
      - run: pyinstaller --onefile --noconsole --name e-Diaxeirisi start_app.py
      - uses: actions/upload-artifact@v4
        with:
          name: e-Diaxeirisi-exe
          path: dist/e-Diaxeirisi.exe
