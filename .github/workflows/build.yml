name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:  # Επιτρέπει χειροκίνητη εκτέλεση

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.8'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller flask pandas openpyxl
    
    - name: Build executable
      run: |
        pyinstaller --onefile --noconsole --name e-Diaxeirisi start_app.py
    
    - name: List dist folder
      run: dir dist
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: e-Diaxeirisi-Windows
        path: dist/e-Diaxeirisi.exe
        retention-days: 90  # Θα παραμείνει διαθέσιμο για 90 ημέρες
