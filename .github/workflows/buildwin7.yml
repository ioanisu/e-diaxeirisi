name: Build for Windows 7

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2019  # Είναι η τελευταία έκδοση που υποστηρίζει Python 3.8
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python 3.8
      uses: actions/setup-python@v5
      with:
        python-version: '3.8'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller flask pandas openpyxl
    
    - name: Build executable
      run: |
        pyinstaller --onefile --noconsole --name e-Diaxeirisi start_app.py
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: e-Diaxeirisi-Windows7
        path: dist/e-Diaxeirisi.exe
        retention-days: 90
