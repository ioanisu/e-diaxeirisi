name: Build Windows EXE

on: [workflow_dispatch]

jobs:
  build:
    runs-on: windows-2019
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.8'
    - run: pip install pyinstaller==5.13.2 ttkbootstrap pandas openpyxl
    - run: pyinstaller --onefile --noconsole --name e-Diaxeirisi e-diaxeirisi_master.py
    - uses: actions/upload-artifact@v4
      with:
        name: e-Diaxeirisi-Windows7
        path: dist/e-Diaxeirisi.exe
